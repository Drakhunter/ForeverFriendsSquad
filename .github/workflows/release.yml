name: CurseForge & GitHub Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate Addon & Lua Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Verify .toc File References
        shell: bash
        run: |
          echo "Checking ForeverFriends.toc entries..."
          while IFS= read -r line || [[ -n "$line" ]]; do
            clean=$(echo "$line" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            if [[ -z "$clean" || "$clean" == \#* ]]; then
              continue
            fi
            path="${clean//\\//}"
            if [[ ! -f "$path" ]]; then
              echo "::error::Missing file referenced in ForeverFriends.toc: $path"
              exit 1
            fi
          done < ForeverFriends.toc
          echo "All .toc file references exist."

      - name: Validate Lua Syntax (Core, Modules, UI)
        shell: bash
        run: |
          find Core Modules UI -name "*.lua" -print0 | xargs -0 -n1 luac5.1 -p
          echo "All Lua files passed syntax check."

  release:
    name: Package & Publish (GitHub + CurseForge)
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run BigWigsMods Addon Packager
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
